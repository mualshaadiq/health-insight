<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health Insight</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232a78d6' d='M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2.1 0 3.6 1.2 4.4 2.6.8-1.4 2.3-2.6 4.4-2.6 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<script src="vendor/chart.umd.min.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Health Insight</h1>
    <span id="status" class="status">Loading…</span>
  </div>
  <div class="controls">
    <div class="seg" role="group" aria-label="Date range">
      <button data-days="30">30d</button>
      <button data-days="90">90d</button>
      <button data-days="180">180d</button>
      <button data-days="365">1y</button>
    </div>
    <button id="refresh" class="btn" title="Fetch fresh data from Garmin">Refresh</button>
  </div>
</header>

<div id="banner" class="banner" hidden></div>

<main id="app">
  <section aria-labelledby="h-today">
    <h2 id="h-today">Today</h2>
    <div class="today">
      <div class="hero card" id="readiness"></div>
      <div class="tiles" id="tiles"></div>
    </div>
  </section>

  <section aria-labelledby="h-insights">
    <h2 id="h-insights">Insights</h2>
    <p class="sub">Rule-based reads of your own trends, not medical advice. Baselines are your last 28 days.</p>
    <div class="insights" id="insights"></div>
  </section>

  <section aria-labelledby="h-recovery">
    <h2 id="h-recovery">Sleep &amp; recovery</h2>
    <div class="grid">
      <figure class="card wide"><figcaption>Sleep by stage <span class="unit">hours / night</span></figcaption><div class="chart"><canvas id="c-sleep"></canvas></div></figure>
      <figure class="card"><figcaption>HRV overnight <span class="unit">ms · band = balanced range</span></figcaption><div class="chart"><canvas id="c-hrv"></canvas></div></figure>
      <figure class="card"><figcaption>Resting heart rate <span class="unit">bpm</span></figcaption><div class="chart"><canvas id="c-rhr"></canvas></div></figure>
      <figure class="card"><figcaption>Body Battery <span class="unit">daily high &amp; low</span></figcaption><div class="chart"><canvas id="c-bb"></canvas></div></figure>
      <figure class="card"><figcaption>Average stress <span class="unit">0–100</span></figcaption><div class="chart"><canvas id="c-stress"></canvas></div></figure>
      <figure class="card"><figcaption>Steps <span class="unit">dashed = goal</span></figcaption><div class="chart"><canvas id="c-steps"></canvas></div></figure>
      <figure class="card" id="f-vo2"><figcaption>VO₂ max <span class="unit">ml/kg/min</span></figcaption><div class="chart"><canvas id="c-vo2"></canvas></div></figure>
      <figure class="card" id="f-weight"><figcaption>Weight <span class="unit">kg</span></figcaption><div class="chart"><canvas id="c-weight"></canvas></div></figure>
    </div>
  </section>

  <section aria-labelledby="h-workouts">
    <h2 id="h-workouts">Workouts</h2>
    <div class="tiles row" id="wtiles"></div>
    <div class="grid">
      <figure class="card wide"><figcaption>Weekly training volume <span class="unit">hours by sport</span></figcaption><div class="chart"><canvas id="c-volume"></canvas></div></figure>
      <figure class="card wide"><figcaption>Training load <span class="unit">7-day acute vs 28-day chronic (daily avg)</span></figcaption><div class="chart"><canvas id="c-load"></canvas></div></figure>
      <figure class="card"><figcaption>Time in heart-rate zones <span class="unit">hours</span></figcaption><div class="chart short"><canvas id="c-zones"></canvas></div></figure>
      <figure class="card"><figcaption>Sport mix <span class="unit">hours</span></figcaption><div class="chart short"><canvas id="c-sports"></canvas></div></figure>
    </div>
    <figure class="card table-card">
      <figcaption>Recent activities</figcaption>
      <div class="table-wrap"><table id="acts"><thead><tr>
        <th>Date</th><th>Sport</th><th>Name</th><th class="n">Duration</th><th class="n">Distance</th><th class="n">Avg HR</th><th class="n">Load</th><th class="n">Aerobic TE</th>
      </tr></thead><tbody></tbody></table></div>
    </figure>
  </section>

  <section aria-labelledby="h-sources">
    <h2 id="h-sources">Data sources</h2>
    <p class="sub">Each Garmin endpoint is fetched separately; one failing doesn't block the rest. Expand to inspect the raw JSON.</p>
    <div id="sources" class="sources"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
